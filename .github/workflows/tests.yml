name: API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 09:00 UTC daily — a nightly smoke test against production.
    - cron: "0 9 * * *"
  workflow_dispatch:
  repository_dispatch:
    # Fired by portfolio-website's trigger-api-tests.yml whenever backend/** changes.
    types: [backend-changed]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Report pending status to portfolio-website
        if: github.event_name == 'repository_dispatch'
        run: |
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.WEBSITE_API_STATUS_TOKEN }}" \
            https://api.github.com/repos/shafi-hassan0/portfolio-website-api/statuses/${{ github.event.client_payload.sha }} \
            -d "{\"state\":\"pending\",\"context\":\"API Tests\",\"description\":\"REST Assured suite running...\",\"target_url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"

      - name: Run API tests
        run: mvn -B test | tee test-output.log

      - name: Extract test summary
        if: always() && github.event_name == 'repository_dispatch'
        id: summary
        run: |
          LINE=$(grep -oE 'Tests run: [0-9]+, Failures: [0-9]+, Errors: [0-9]+, Skipped: [0-9]+$' test-output.log | tail -1)
          echo "line=${LINE:-Tests run: unknown}" >> "$GITHUB_OUTPUT"

      - name: Report success to portfolio-website
        if: success() && github.event_name == 'repository_dispatch'
        run: |
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.WEBSITE_API_STATUS_TOKEN }}" \
            https://api.github.com/repos/shafi-hassan0/portfolio-website-api/statuses/${{ github.event.client_payload.sha }} \
            -d "{\"state\":\"success\",\"context\":\"API Tests\",\"description\":\"${{ steps.summary.outputs.line }}\",\"target_url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"

      - name: Report failure to portfolio-website
        if: failure() && github.event_name == 'repository_dispatch'
        run: |
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.WEBSITE_API_STATUS_TOKEN }}" \
            https://api.github.com/repos/shafi-hassan0/portfolio-website-api/statuses/${{ github.event.client_payload.sha }} \
            -d "{\"state\":\"failure\",\"context\":\"API Tests\",\"description\":\"${{ steps.summary.outputs.line }}\",\"target_url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
