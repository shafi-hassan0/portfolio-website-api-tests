name: API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 09:00 UTC daily — a nightly smoke test against production.
    - cron: "0 9 * * *"
  workflow_dispatch:
  repository_dispatch:
    # Fired by portfolio-website's trigger-api-tests.yml whenever backend/** changes.
    types: [backend-changed]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Report pending status to portfolio-website
        if: github.event_name == 'repository_dispatch'
        run: |
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.WEBSITE_STATUS_TOKEN }}" \
            https://api.github.com/repos/shafi-hassan0/portfolio-website/statuses/${{ github.event.client_payload.sha }} \
            -d "{\"state\":\"pending\",\"context\":\"API Tests\",\"description\":\"REST Assured suite running...\",\"target_url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"

      - name: Run API tests
        run: mvn -B test

      - name: Report success to portfolio-website
        if: success() && github.event_name == 'repository_dispatch'
        run: |
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.WEBSITE_STATUS_TOKEN }}" \
            https://api.github.com/repos/shafi-hassan0/portfolio-website/statuses/${{ github.event.client_payload.sha }} \
            -d "{\"state\":\"success\",\"context\":\"API Tests\",\"description\":\"All API tests passed\",\"target_url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"

      - name: Report failure to portfolio-website
        if: failure() && github.event_name == 'repository_dispatch'
        run: |
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.WEBSITE_STATUS_TOKEN }}" \
            https://api.github.com/repos/shafi-hassan0/portfolio-website/statuses/${{ github.event.client_payload.sha }} \
            -d "{\"state\":\"failure\",\"context\":\"API Tests\",\"description\":\"One or more API tests failed\",\"target_url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
